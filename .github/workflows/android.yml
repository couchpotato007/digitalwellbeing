name: Android app

# Builds the APK on every change to android/ and publishes it where Obtainium
# finds it:
# - a v1.2.3 tag as wellbeing-1.2.3.apk in the release v1.2.3
# - a push to main as a prerelease nightly-<run number>, the last
#   $NIGHTLIES of them are kept
# Pull requests only build.
#
# The APK is signed with the key in these secrets, the same key every time so
# updates install over the previous version:
#   ANDROID_KEYSTORE           base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NIGHTLIES: 5

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "name=nightly-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            echo "::error::ANDROID_KEYSTORE is not set, a release needs the fixed key"
            exit 1
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk wellbeing-${{ steps.version.outputs.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wellbeing-${{ steps.version.outputs.name }}
          path: android/wellbeing-*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" wellbeing-*.apk --clobber
      # tags made with the workflow's token start no other workflows
      - if: steps.version.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" wellbeing-*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $GITHUB_RUN_NUMBER" --notes "Built from $GITHUB_SHA"
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^nightly-' | sort -t- -k2 -rn | tail -n +$((NIGHTLIES + 1)) \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
